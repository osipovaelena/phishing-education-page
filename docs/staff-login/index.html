<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS - Central Authentication Service</title>
<style>
  html{border-top:2px solid #000;}
  body{
    margin:0;
    background:#fff;
    color:#333;
    font-family:Arial, Helvetica, sans-serif;
    font-size:14px;
  }
  .logo-bar{padding:18px 22px 10px;}
  .logo-bar img{display:block; width:214px; height:100px;}

  .band{
    background:#0d9ec3;
    color:#fff;
  }
  .band h1{
    margin:0;
    max-width:1200px;
    padding:14px 22px;
    font-family:Georgia, "Times New Roman", serif;
    font-weight:bold;
    font-size:30px;
    letter-spacing:.3px;
  }

  .content{
    display:flex;
    flex-wrap:wrap;
    gap:30px;
    max-width:1200px;
    padding:22px;
  }

  .login-box{
    flex:0 0 330px;
    background:#eee;
    border:1px solid #ddd;
    border-radius:8px;
    padding:20px 22px 24px;
  }
  .login-box h2{
    margin:0 0 6px;
    padding-bottom:12px;
    border-bottom:1px solid #ccc;
    font-family:Georgia, "Times New Roman", serif;
    font-weight:bold;
    font-size:21px;
    color:#333;
  }
  .field{margin-top:16px;}
  .field label{
    display:block;
    margin-bottom:5px;
    color:#555;
  }
  .field input[type="text"],
  .field input[type="password"]{
    width:100%;
    padding:5px 6px;
    background:#ffffdd;
    border:1px solid #b3b3b3;
    font-size:14px;
    box-sizing:border-box;
  }
  .warn{
    margin:18px 0;
    padding-bottom:16px;
    border-bottom:1px solid #ccc;
    color:#555;
  }
  .warn label{cursor:pointer;}
  .actions{display:flex; align-items:center; gap:12px;}
  .btn-login{
    font-family:Arial, Helvetica, sans-serif;
    font-size:14px;
    padding:4px 12px;
    background:#f4f4f4;
    border:1px solid #888;
    border-radius:2px;
    cursor:pointer;
  }
  .btn-login:hover{background:#e9e9e9;}
  .clear-link{color:#555;}

  .notice{
    flex:1 1 300px;
    min-width:280px;
    color:#333;
    line-height:1.5;
    padding-top:2px;
  }

  footer{
    max-width:1200px;
    padding:40px 22px 50px;
    text-align:center;
    font-weight:bold;
    color:#333;
  }

  @media (max-width:640px){
    .band h1{font-size:24px;}
    .login-box{flex:1 1 auto;}
  }
</style>
</head>

  <div class="band">
    <h1>Central Authentication Service</h1>
  </div>

  <div class="content">
    <form class="login-box" onsubmit="window.location.href='/phishing-education-page/'; return false;">
      <h2>Enter your Username and Password</h2>

      <div class="field">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" autocomplete="off">
      </div>

      <div class="field">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" autocomplete="off">
      </div>

      <div class="warn">
        <label>
          <input type="checkbox" name="warn"> Warn me before logging me into other sites.
        </label>
      </div>

      <div class="actions">
        <button type="submit" class="btn-login">LOGIN</button>
        <span>|</span>
        <a href="/phishing-education-page/" class="clear-link">clear</a>
      </div>
    </form>

    <div class="notice">
      For security reasons, please Log Out and Exit your web browser when you are done accessing services that require authentication!
    </div>
  </div>

  <footer>Holmesglen Institute of TAFE - Simulation training</footer>
